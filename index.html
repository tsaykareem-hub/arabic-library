<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة الأندلس</title>
  <meta name="google-site-verification" content="MoIH_1_Y8BlTR2XWCS9GOq2ChpSlge_KY7sBXblT4l0" />
<link rel="icon" type="image/png" href="library">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@400;600&family=Lateef&family=Markazi+Text:wght@400;600&family=Cairo:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2c2115;
    --ink-soft:#4a3b28;
    --parchment:#f4ecd8;
    --parchment-deep:#ead9b4;
    --teal:#1f5c56;
    --teal-deep:#123f3b;
    --gold:#b8862f;
    --gold-bright:#d9a83f;
    --terracotta:#a35a35;
    --line: rgba(44,33,21,0.18);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #fbf5e6 0%, var(--parchment) 55%, var(--parchment-deep) 100%);
    color:var(--ink);
    font-family:'Amiri', serif;
    min-height:100vh;
    direction:rtl;
  }

  /* ---------- ornamental star pattern band ---------- */
  .star-band{
    height:26px;
    background-color:var(--teal-deep);
    background-image:
      repeating-linear-gradient(45deg, rgba(217,168,63,0.35) 0 2px, transparent 2px 22px),
      repeating-linear-gradient(-45deg, rgba(217,168,63,0.35) 0 2px, transparent 2px 22px);
    border-top:2px solid var(--gold);
    border-bottom:2px solid var(--gold);
  }

  /* ---------- header / hero ---------- */
  header.hero{
    padding:56px 24px 40px;
    text-align:center;
    position:relative;
  }
  .lamp-icon{width:34px;height:34px;fill:var(--gold);opacity:.85;margin-bottom:6px;}
  h1.site-title{
    font-family:'Aref Ruqaa', serif;
    font-weight:700;
    font-size:clamp(2.4rem, 6vw, 4rem);
    color:var(--teal-deep);
    margin:6px 0 8px;
    letter-spacing:1px;
    text-shadow: 1px 1px 0 rgba(184,134,47,0.25);
  }
  p.site-tagline{
    font-family:'Amiri', serif;
    font-style:italic;
    font-size:1.15rem;
    color:var(--ink-soft);
    max-width:520px;
    margin:0 auto;
    line-height:2;
  }

  .arch-divider{
    display:flex;
    justify-content:center;
    gap:10px;
    margin:26px auto 0;
  }
  .arch-divider span{
    width:0;height:0;
    border-left:9px solid transparent;
    border-right:9px solid transparent;
    border-bottom:14px solid var(--gold);
    opacity:.75;
  }
  .arch-divider span:nth-child(2){ transform:translateY(-4px); opacity:1; }

  main{ max-width:1040px; margin:0 auto; padding:10px 20px 80px; }

  /* ---------- category grid (home) ---------- */
  .categories{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(190px,1fr));
    gap:26px;
    margin-top:36px;
  }
  .arch-card{
    background:linear-gradient(180deg, #fffaf0 0%, var(--parchment) 100%);
    border:2px solid var(--gold);
    border-radius:80px 80px 10px 10px;
    padding:38px 16px 26px;
    text-align:center;
    cursor:pointer;
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
    box-shadow:0 3px 0 var(--gold);
  }
  .arch-card:hover{ transform:translateY(-4px); }
  .arch-card:focus-visible{ outline:3px solid var(--teal); outline-offset:3px; }
  .arch-card::before{
    content:"";
    position:absolute;
    top:14px; left:50%; transform:translateX(-50%);
    width:14px;height:14px;
    background:var(--gold);
    clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
  }
  .arch-card .icon{ width:52px;height:52px; margin:10px auto 14px; color:var(--teal-deep); }
  .arch-card .icon svg{ width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.4; }
  .arch-card h2{
    font-family:'Aref Ruqaa', serif;
    font-size:1.5rem;
    margin:0 0 6px;
    color:var(--teal-deep);
  }
  .arch-card .count{
    font-family:'Cairo', sans-serif;
    font-size:.85rem;
    color:var(--ink-soft);
  }

  /* ---------- list view ---------- */
  .back-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:none; border:none; cursor:pointer;
    font-family:'Cairo', sans-serif;
    font-size:1rem;
    color:var(--teal-deep);
    padding:10px 4px;
    margin-top:10px;
  }
  .back-btn svg{ width:18px; height:18px; fill:currentColor; }

  h2.section-title{
    font-family:'Aref Ruqaa', serif;
    font-size:2rem;
    color:var(--teal-deep);
    text-align:center;
    margin:6px 0 30px;
  }

  .piece-list{ display:flex; flex-direction:column; gap:16px; }
  .piece-item{
    background:#fffaf0;
    border:1px solid var(--line);
    border-right:6px solid var(--gold);
    border-radius:6px;
    padding:18px 22px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:14px;
    transition:background .15s ease;
  }
  .piece-item:hover{ background:#fff4dc; }
  .piece-item:focus-visible{ outline:3px solid var(--teal); }
  .piece-item h3{
    font-family:'Amiri', serif;
    font-weight:700;
    font-size:1.25rem;
    margin:0 0 4px;
    color:var(--ink);
  }
  .piece-item .snippet{
    font-size:.95rem;
    color:var(--ink-soft);
    max-width:60ch;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .piece-arrow{ flex-shrink:0; width:20px; height:20px; fill:var(--teal-deep); transform:scaleX(-1); }
  .empty-msg{
    text-align:center;
    color:var(--ink-soft);
    font-size:1.1rem;
    padding:50px 10px;
    font-family:'Amiri', serif;
  }
  .owner-controls-inline{ display:flex; gap:10px; }
  .icon-btn{
    background:none; border:1px solid var(--line); border-radius:6px;
    width:34px;height:34px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:var(--terracotta);
  }
  .icon-btn svg{ width:16px;height:16px; fill:currentColor; }

  /* ---------- reader ---------- */
  .reader-toolbar{
    display:flex; flex-wrap:wrap; gap:10px; align-items:center;
    justify-content:center;
    background:var(--parchment-deep);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 16px;
    margin-bottom:28px;
  }
  .reader-toolbar label{ font-family:'Cairo',sans-serif; font-size:.85rem; color:var(--ink-soft); }
  .reader-toolbar select, .reader-toolbar button.size-btn{
    font-family:'Cairo', sans-serif;
    border:1px solid var(--gold);
    background:#fffaf0;
    color:var(--ink);
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;
  }
  .page{
    background:#fffdf6;
    border:1px solid var(--line);
    border-radius:4px;
    padding:50px clamp(20px,6vw,70px);
    box-shadow:0 0 0 6px #fffdf6, 0 0 0 8px var(--gold), 0 8px 24px rgba(44,33,21,0.12);
    max-width:760px;
    margin:0 auto;
  }
  .page h1.piece-title{
    font-family:'Aref Ruqaa', serif;
    text-align:center;
    font-size:2rem;
    color:var(--teal-deep);
    margin:0 0 28px;
  }
  .page .piece-body{
    line-height:2.4;
    font-size:1.25rem;
    white-space:pre-wrap;
    text-align:justify;
  }

  /* ---------- floating owner lamp ---------- */
  .owner-fab{
    position:fixed; bottom:22px; left:22px;
    width:52px;height:52px;
    background:var(--teal-deep);
    border:2px solid var(--gold);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,0.25);
    z-index:50;
  }
  .owner-fab svg{ width:24px;height:24px; fill:var(--gold-bright); }
  .owner-fab.active{ background:var(--gold); }
  .owner-fab.active svg{ fill:var(--teal-deep); }

  /* ---------- modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(20,15,8,0.55);
    display:flex; align-items:center; justify-content:center;
    z-index:100; padding:16px;
  }
  .modal-box{
    background:var(--parchment);
    border:2px solid var(--gold);
    border-radius:12px;
    max-width:480px; width:100%;
    padding:28px 26px;
    max-height:90vh; overflow-y:auto;
  }
  .modal-box h3{
    font-family:'Aref Ruqaa', serif;
    color:var(--teal-deep);
    font-size:1.5rem;
    margin:0 0 16px;
    text-align:center;
  }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-family:'Cairo',sans-serif; font-size:.9rem; margin-bottom:6px; color:var(--ink-soft); }
  .field input, .field select, .field textarea{
    width:100%;
    font-family:'Cairo', sans-serif;
    border:1px solid var(--line);
    border-radius:6px;
    padding:10px 12px;
    font-size:1rem;
    background:#fffaf0;
    color:var(--ink);
  }
  .field textarea{ font-family:'Amiri',serif; min-height:160px; resize:vertical; line-height:1.9; }
  .modal-actions{ display:flex; gap:10px; margin-top:8px; }
  .btn{
    font-family:'Cairo', sans-serif;
    border:none; border-radius:6px;
    padding:11px 20px;
    cursor:pointer;
    font-size:.95rem;
    flex:1;
  }
  .btn-primary{ background:var(--teal-deep); color:#fdf6e3; }
  .btn-secondary{ background:none; border:1px solid var(--line); color:var(--ink-soft); }
  .btn-danger{ background:var(--terracotta); color:#fff; }
  .modal-msg{ font-family:'Cairo',sans-serif; font-size:.85rem; color:var(--terracotta); margin-top:-8px; margin-bottom:10px; min-height:1em; }

  footer{
    text-align:center;
    padding:22px;
    font-family:'Cairo', sans-serif;
    font-size:.85rem;
    color:var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce){
    .arch-card{ transition:none; }
  }
</style>
</head>
<body>

<div class="star-band"></div>
<header class="hero">
  <svg class="lamp-icon" viewBox="0 0 24 24"><path d="M12 2c-1 0-1.8.8-1.8 1.8 0 .5.2.9.5 1.2C8.4 5.6 7 7.3 7 9.3c0 2 1.3 3.6 3.2 4.2l-1 3.5H9a1 1 0 0 0 0 2h1.7l-.4 1.4A1 1 0 0 0 11.3 22H12.7a1 1 0 0 0 1-1.6l-.4-1.4H15a1 1 0 0 0 0-2h-1.2l-1-3.5C14.7 12.9 16 11.3 16 9.3c0-2-1.4-3.7-3.7-4.3.3-.3.5-.7.5-1.2C13.8 2.8 13 2 12 2z"/></svg>
  <h1 class="site-title">مكتبة الأندلس</h1>
  <p class="site-tagline">هنا تُصان الحكمة، وتُروى القصص، ويُنشد الشعر، كما كانت تُصان في بيوت الحكمة القديمة</p>
  <div class="arch-divider"><span></span><span></span><span></span></div>
</header>

<main id="app"></main>

<div class="owner-fab" id="ownerFab" title="دخول صاحب المكتبة" aria-label="دخول صاحب المكتبة">
  <svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 8-4v6h2V7L12 2zM4 9.6V15c0 2.2 3.6 4 8 4s8-1.8 8-4v-5.4l-8 4-8-4z"/></svg>
</div>

<footer>مكتبة شخصية بسيطة، بلا حسابات وبلا اشتراكات — للقراءة فقط</footer>

<script>
/* ================= DATA ================= */
const CATEGORIES = [
  { key:"books", label:"كتب", icon:`<svg viewBox="0 0 24 24"><path d="M4 4c3 0 6 1 8 2 2-1 5-2 8-2v15c-3 0-6 1-8 2-2-1-5-2-8-2V4z"/><line x1="12" y1="6" x2="12" y2="19"/></svg>` },
  { key:"articles", label:"مقالات", icon:`<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1"/><line x1="7" y1="7" x2="17" y2="7"/><line x1="7" y1="11" x2="17" y2="11"/><line x1="7" y1="15" x2="13" y2="15"/></svg>` },
  { key:"wisdom", label:"حكم وأقوال", icon:`<svg viewBox="0 0 24 24"><path d="M12 3c4 0 7 2.5 7 6 0 2.6-1.8 4-3.5 5-1 .6-1.5 1.2-1.5 2.3V17h-4v-.7c0-1.1-.5-1.7-1.5-2.3C6.8 13 5 11.6 5 9c0-3.5 3-6 7-6z"/><line x1="10" y1="20" x2="14" y2="20"/></svg>` },
  { key:"poetry", label:"شعر", icon:`<svg viewBox="0 0 24 24"><path d="M20 4c-4 0-8 2-11 5-2 2-4 5-5 9 4-1 7-3 9-5 3-3 5-7 5-11 1 1 2 3 2 2z"/></svg>` },
  { key:"stories", label:"قصص", icon:`<svg viewBox="0 0 24 24"><path d="M4 19V6a2 2 0 0 1 2-2h9l5 5v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M15 4v5h5"/></svg>` }
];

const FONT_OPTIONS = [
  { key:"Amiri", label:"أميري (كلاسيكي)" },
  { key:"Aref Ruqaa", label:"عارف رقعة (خط مزخرف)" },
  { key:"Lateef", label:"لطيف (بسيط وواضح)" },
  { key:"Markazi Text", label:"مركزي (مريح للقراءة)" },
  { key:"Reem Kufi", label:"ريم كوفي (كوفي عصري)" }
];

const SEED_PIECES = [
  { id:"seed1", category:"wisdom", title:"في طلب العلم", body:"من صبر على قِلّة الزاد في طريق العلم، وجد كثرة الزاد في آخره.\nومن استعجل الثمرة قبل أوانها، ذاق مرارتها قبل حلاوتها.", font:"Amiri" },
  { id:"seed2", category:"poetry", title:"نسيم الأندلس", body:"يا نسيمًا مرّ من وادي الحجر\nحمّل الشوق إلى تلك الديار\nقل لأزهار الرَّبى في قرطبة\nإنّ قلبي بينكم لا يزال حائر", font:"Aref Ruqaa" },
  { id:"seed3", category:"stories", title:"الوزير والحمامة", body:"يُحكى أن وزيرًا في بغداد كان يجلس كل صباح عند نافذته، فرأى حمامة تبني عشّها فوق شجرة قريبة، مرّة بعد مرّة يسقط العش فتعيد بناءه من جديد. فقال الوزير لخادمه: علّمتني هذه الحمامة في يوم واحد ما لم أتعلّمه في عشرين عامًا من الوزارة: أن المحاولة لا تكِلّ.", font:"Amiri" },
  { id:"seed4", category:"books", title:"مقدمة في الحكمة (نموذج كتاب)", body:"هذا نص تجريبي يوضّح كيف سيظهر كتاب كامل تضيفه إلى المكتبة. يمكنك استبدال هذا النص بأي كتاب تريد حفظه هنا، فصلًا بعد فصل، أو دفعة واحدة.", font:"Amiri" },
  { id:"seed5", category:"articles", title:"عن بيت الحكمة (نموذج مقال)", body:"في بغداد القديمة، ازدهرت بيوت الحكمة كمراكز لجمع المعرفة وترجمتها. هذا مثال بسيط لمقال يمكن أن تكتبه أو تنسخه هنا، ليقرأه كل من يزور المكتبة.", font:"Amiri" }
];

/* ================ STATE ================ */
let pieces = loadPieces();
let ownerUnlocked = false;
let route = { view:"home" };

function loadPieces(){
  try{
    const raw = localStorage.getItem("andalus_pieces");
    if(raw) return JSON.parse(raw);
  }catch(e){}
  localStorage.setItem("andalus_pieces", JSON.stringify(SEED_PIECES));
  return SEED_PIECES.slice();
}
function savePieces(){ localStorage.setItem("andalus_pieces", JSON.stringify(pieces)); }

/* ================ RENDER ================ */
const app = document.getElementById("app");

function render(){
  if(route.view === "home") return renderHome();
  if(route.view === "list") return renderList(route.category);
  if(route.view === "reader") return renderReader(route.id);
}

function renderHome(){
  const cards = CATEGORIES.map(c=>{
    const count = pieces.filter(p=>p.category===c.key).length;
    return `
      <button class="arch-card" data-cat="${c.key}">
        <div class="icon">${c.icon}</div>
        <h2>${c.label}</h2>
        <div class="count">${count} نصًا</div>
      </button>`;
  }).join("");

  app.innerHTML = `<div class="categories">${cards}</div>`;

  app.querySelectorAll(".arch-card").forEach(el=>{
    el.addEventListener("click", ()=>{
      route = { view:"list", category: el.dataset.cat };
      render();
    });
  });
}

function renderList(catKey){
  const cat = CATEGORIES.find(c=>c.key===catKey);
  const items = pieces.filter(p=>p.category===catKey);

  const list = items.length
    ? items.map(p=>`
        <div class="piece-item" tabindex="0" data-id="${p.id}">
          <div>
            <h3>${escapeHtml(p.title)}</h3>
            <div class="snippet">${escapeHtml(p.body.slice(0,80))}</div>
          </div>
          <div style="display:flex; align-items:center; gap:10px;">
            ${ownerUnlocked ? `
              <div class="owner-controls-inline">
                <button class="icon-btn" data-edit="${p.id}" title="تعديل" aria-label="تعديل">
                  <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                </button>
                <button class="icon-btn" data-delete="${p.id}" title="حذف" aria-label="حذف">
                  <svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13H7L6 7zm3-4h6l1 2H8l1-2z"/></svg>
                </button>
              </div>` : ``}
            <svg class="piece-arrow" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
          </div>
        </div>`).join("")
    : `<div class="empty-msg">لا يوجد شيء هنا بعد. عد لاحقًا لتجد نصوصًا جديدة.</div>`;

  app.innerHTML = `
    <button class="back-btn" id="backHome">
      <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      العودة إلى المكتبة
    </button>
    <h2 class="section-title">${cat.label}</h2>
    <div class="piece-list">${list}</div>
  `;

  document.getElementById("backHome").addEventListener("click", ()=>{ route={view:"home"}; render(); });

  app.querySelectorAll(".piece-item").forEach(el=>{
    el.addEventListener("click", (e)=>{
      if(e.target.closest("[data-edit]") || e.target.closest("[data-delete]")) return;
      route = { view:"reader", id: el.dataset.id };
      render();
    });
    el.addEventListener("keypress", (e)=>{
      if(e.key==="Enter"){ route = { view:"reader", id: el.dataset.id }; render(); }
    });
  });

  app.querySelectorAll("[data-edit]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      openPieceForm(pieces.find(p=>p.id===btn.dataset.edit));
    });
  });
  app.querySelectorAll("[data-delete]").forEach(btn=>{
    btn.addEventListener("click", (e)=>{
      e.stopPropagation();
      if(confirm("هل تريد حذف هذا النص؟")){
        pieces = pieces.filter(p=>p.id!==btn.dataset.delete);
        savePieces();
        renderList(catKey);
      }
    });
  });
}

function renderReader(id){
  const p = pieces.find(x=>x.id===id);
  if(!p){ route={view:"home"}; return render(); }

  const fontOpts = FONT_OPTIONS.map(f=>`<option value="${f.key}" ${f.key===p.font?"selected":""}>${f.label}</option>`).join("");

  app.innerHTML = `
    <button class="back-btn" id="backList">
      <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
      العودة إلى القائمة
    </button>

    <div class="reader-toolbar">
      <label for="fontSelect">الخط:</label>
      <select id="fontSelect">${fontOpts}</select>
      <button class="size-btn" id="decSize">أصغر</button>
      <button class="size-btn" id="incSize">أكبر</button>
    </div>

    <article class="page">
      <h1 class="piece-title">${escapeHtml(p.title)}</h1>
      <div class="piece-body" id="pieceBody" style="font-family:'${p.font}', serif;">${escapeHtml(p.body)}</div>
    </article>
  `;

  let size = 1.25;
  const bodyEl = document.getElementById("pieceBody");

  document.getElementById("backList").addEventListener("click", ()=>{ route={view:"list", category:p.category}; render(); });
  document.getElementById("fontSelect").addEventListener("change", (e)=>{
    bodyEl.style.fontFamily = `'${e.target.value}', serif`;
  });
  document.getElementById("incSize").addEventListener("click", ()=>{ size=Math.min(size+0.15,2.2); bodyEl.style.fontSize = size+"rem"; });
  document.getElementById("decSize").addEventListener("click", ()=>{ size=Math.max(size-0.15,0.9); bodyEl.style.fontSize = size+"rem"; });
}

function escapeHtml(str){
  return (str||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

/* ================ OWNER MODE ================ */
const ownerFab = document.getElementById("ownerFab");

ownerFab.addEventListener("click", ()=>{
  if(ownerUnlocked){
    openAddMenu();
  }else{
    openPassphraseModal();
  }
});

function hasPassphrase(){ return !!localStorage.getItem("andalus_pass"); }

function openPassphraseModal(){
  const isNew = !hasPassphrase();
  showModal(`
    <h3>${isNew ? "إنشاء كلمة سر لصاحب المكتبة" : "دخول صاحب المكتبة"}</h3>
    <div class="field">
      <label>${isNew ? "اختر كلمة سر تتذكرها" : "أدخل كلمة السر"}</label>
      <input type="password" id="passInput" autofocus>
    </div>
    <div class="modal-msg" id="passMsg"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="passSubmit">${isNew ? "حفظ ودخول" : "دخول"}</button>
      <button class="btn btn-secondary" id="passCancel">إلغاء</button>
    </div>
  `);

  document.getElementById("passCancel").addEventListener("click", closeModal);
  document.getElementById("passSubmit").addEventListener("click", ()=>{
    const val = document.getElementById("passInput").value.trim();
    if(!val){ document.getElementById("passMsg").textContent = "يرجى إدخال كلمة سر."; return; }
    if(isNew){
      localStorage.setItem("andalus_pass", val);
      ownerUnlocked = true;
      closeModal();
      updateFabState();
      render();
    }else{
      if(val === localStorage.getItem("andalus_pass")){
        ownerUnlocked = true;
        closeModal();
        updateFabState();
        render();
      }else{
        document.getElementById("passMsg").textContent = "كلمة السر غير صحيحة.";
      }
    }
  });
}

function updateFabState(){
  ownerFab.classList.toggle("active", ownerUnlocked);
  ownerFab.title = ownerUnlocked ? "إضافة نص جديد" : "دخول صاحب المكتبة";
}

function openAddMenu(){
  openPieceForm(null);
}

function openPieceForm(existing){
  const isEdit = !!existing;
  const catOpts = CATEGORIES.map(c=>`<option value="${c.key}" ${existing&&existing.category===c.key?"selected":""}>${c.label}</option>`).join("");
  const fontOpts = FONT_OPTIONS.map(f=>`<option value="${f.key}" ${existing&&existing.font===f.key?"selected":""}>${f.label}</option>`).join("");

  showModal(`
    <h3>${isEdit ? "تعديل النص" : "إضافة نص جديد"}</h3>
    <div class="field">
      <label>العنوان</label>
      <input type="text" id="fTitle" value="${existing ? escapeHtml(existing.title) : ""}">
    </div>
    <div class="field">
      <label>القسم</label>
      <select id="fCat">${catOpts}</select>
    </div>
    <div class="field">
      <label>الخط</label>
      <select id="fFont">${fontOpts}</select>
    </div>
    <div class="field">
      <label>النص</label>
      <textarea id="fBody">${existing ? existing.body : ""}</textarea>
    </div>
    <div class="modal-msg" id="formMsg"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="formSave">${isEdit ? "حفظ التعديلات" : "إضافة إلى المكتبة"}</button>
      <button class="btn btn-secondary" id="formCancel">إلغاء</button>
    </div>
  `);

  document.getElementById("formCancel").addEventListener("click", closeModal);
  document.getElementById("formSave").addEventListener("click", ()=>{
    const title = document.getElementById("fTitle").value.trim();
    const body = document.getElementById("fBody").value.trim();
    const category = document.getElementById("fCat").value;
    const font = document.getElementById("fFont").value;
    if(!title || !body){
      document.getElementById("formMsg").textContent = "يرجى كتابة العنوان والنص.";
      return;
    }
    if(isEdit){
      Object.assign(existing, { title, body, category, font });
    }else{
      pieces.push({ id:"p_"+Date.now(), title, body, category, font });
    }
    savePieces();
    closeModal();
    route = { view:"list", category };
    render();
  });
}

function showModal(innerHtml){
  closeModal();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "modalOverlay";
  overlay.innerHTML = `<div class="modal-box">${innerHtml}</div>`;
  overlay.addEventListener("click", (e)=>{ if(e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
}
function closeModal(){
  const el = document.getElementById("modalOverlay");
  if(el) el.remove();
}

/* ================ INIT ================ */
render();
</script>
</body>
</html>
